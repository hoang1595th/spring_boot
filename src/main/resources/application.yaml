spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
    cache:
      type: redis
      redis:
        time-to-live: 3600000 # Thời gian sống mặc định của Cache (1 giờ = 3,600,000 ms)
        cache-null-values: false # Không lưu các giá trị null vào Cache
  datasource:
    url: jdbc:postgresql://localhost:5432/sb_learning
#    url: jdbc:postgresql://host.docker.internal:5432/sb_learning
    username: postgres_root
    password: 2eb862e7d16f4da7
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update # Tự động tạo/cập nhật bảng trong PostgreSQL theo Entity
    show-sql: true     # Hiển thị câu lệnh SQL ở console
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  api-docs:
    path: /api-docs

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration-ms: 86400000 # 24 giờ (tính bằng milliseconds)