spring:
  datasource:
    url: jdbc:postgresql://host.docker.internal:5432/sb_learning
    username: postgres_root
    password: 2eb862e7d16f4da7
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update # Tự động tạo/cập nhật bảng trong PostgreSQL theo Entity
    show-sql: true     # Hiển thị câu lệnh SQL ở console
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  api-docs:
    path: /api-docs